const CSS=`
:root{--bg:#f5f7fa;--panel:#ffffff;--panel-border:#e2e8f0;--toolbar:#1e293b;--toolbar-text:#f8fafc;--accent:#3b82f6;--danger:#ef4444;--success:#10b981;--muted:#64748b;--canvas-bg:#ffffff;--wall:#64748b;--exit:#10b981;--safe:#3b82f6;--particle:#22c55e;--particle-evac:#86efac;--select:#3b82f6;--handle:#fde047;--handle-border:#b45309;}
*{box-sizing:border-box}

const CANVAS_W=1300,CANVAS_H=820,MIN_RECT=16,HANDLE=7,RADIUS=7;
const state={mode:'edit',tool:'select',walls:[],exits:[],safes:[],starts:[],particles:[],selected:null,drag:null,running:false,animId:null,iter:0,pso:{w:0.7,c1:1.4,c2:1.4,maxV:10,iters:2},boids:{on:true,sep:1.6,ali:0.6,coh:0.8,radius:70},wallAvoid:true,wallRepel:2.2,showVel:true,showPbest:true,showGbest:true,showBoids:true};
function rand(a,b){return Math.random()*(b-a)+a;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function rectContains(r,p){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function rectDist(r,p){const cx=Math.max(r.x,Math.min(p.x,r.x+r.w)),cy=Math.max(r.y,Math.min(p.y,r.y+r.h));return Math.hypot(p.x-cx,p.y-cy);}
function centerOf(r){return{x:r.x+r.w/2,y:r.y+r.h/2};}
function segDistToPoint(ax,ay,bx,by,px,py){const L2=(bx-ax)**2+(by-ay)**2;if(L2===0)return Math.hypot(px-ax,py-ay);let t=((px-ax)*(bx-ax)+(py-ay)*(by-ay))/L2;t=clamp(t,0,1);return Math.hypot(px-(ax+t*(bx-ax)),py-(ay+t*(by-ay)));}

function psoStep(iters){wgridBuild();WGRID.on=true;try{psoStepInner(iters);}finally{WGRID.on=false;}}
function psoStepInner(iters){
  boidsVis=[];simNavBuild();

/* ===================== SNAPPING ("locking" onto walls, corners, edges, grid) ===================== */
/* ===================== ZOOM AND PAN (view only; the model is unchanged) =====================
   world (map) point (wx,wy) is drawn at canvas pixel ((wx-VIEW.x)*z, (wy-VIEW.y)*z) */
const VIEW={z:1,x:0,y:0,min:1,max:8};
function clampView(){const z=VIEW.z;VIEW.x=clamp(VIEW.x,0,CANVAS_W-CANVAS_W/z);VIEW.y=clamp(VIEW.y,0,CANVAS_H-CANVAS_H/z);}
function dotR(r){return r/Math.sqrt(VIEW.z);}
function installViewScaling(cx){if(cx.__vs||typeof CanvasRenderingContext2D==='undefined'||!(cx instanceof CanvasRenderingContext2D))return;cx.__vs=true;
  const P=CanvasRenderingContext2D.prototype,fd=Object.getOwnPropertyDescriptor(P,'font'),ld=Object.getOwnPropertyDescriptor(P,'lineWidth');
  Object.defineProperty(cx,'font',{configurable:true,get(){return fd.get.call(this);},set(v){const z=VIEW.hud?1:Math.sqrt(VIEW.z);fd.set.call(this,z===1?v:String(v).replace(/(\d+(?:\.\d+)?)px/,(m,n)=>(n/z).toFixed(3)+'px'));}});
  Object.defineProperty(cx,'lineWidth',{configurable:true,get(){return ld.get.call(this);},set(v){ld.set.call(this,VIEW.hud?v:v/Math.sqrt(VIEW.z));}});}
function beginFrame(cx){installViewScaling(cx);cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,CANVAS_W,CANVAS_H);cx.setTransform(VIEW.z,0,0,VIEW.z,-VIEW.x*VIEW.z,-VIEW.y*VIEW.z);}
// draw something fixed on the screen (not zoomed), then return to the map view
function hud(cx,fn){cx.save();cx.setTransform(1,0,0,1,0,0);VIEW.hud=true;try{fn();}finally{VIEW.hud=false;cx.restore();}}
function zoomAt(px,py,f){const z0=VIEW.z,z1=clamp(z0*f,VIEW.min,VIEW.max);if(Math.abs(z1-z0)<1e-9)return;
  const wx=px/z0+VIEW.x,wy=py/z0+VIEW.y;VIEW.z=z1;VIEW.x=wx-px/z1;VIEW.y=wy-py/z1;clampView();zoomLabel();redraw();}
function zoomFit(){VIEW.z=1;VIEW.x=0;VIEW.y=0;zoomLabel();redraw();}
function zoomLabel(){const l=document.getElementById('zoomLbl');if(l)l.textContent=Math.round(VIEW.z*100)+'%';}
const SNAP={tol:10,grid:10,vis:null};
function snapOn(e){const c=document.getElementById('snapObj');return !(e&&e.altKey)&&(!c||c.checked);}
function gridOn(e){const c=document.getElementById('snapGrid');return !(e&&e.altKey)&&!!(c&&c.checked);}
function pxPerM(){const el=document.getElementById('stScale');return (el&&+el.value)||20;}
function fmtM(px){return (px/pxPerM()).toFixed(1)+' m';}
// everything that can be snapped to (except the objects being moved)
function snapTargets(ex){
  const pts=[],xs=[],ys=[],segs=[];
  for(const w of state.walls){if(ex&&ex.has(w))continue;
    if(w.x1!==undefined){pts.push({x:w.x1,y:w.y1},{x:w.x2,y:w.y2});xs.push(w.x1,w.x2);ys.push(w.y1,w.y2);segs.push(w);}
    else{pts.push({x:w.x,y:w.y},{x:w.x+w.w,y:w.y},{x:w.x,y:w.y+w.h},{x:w.x+w.w,y:w.y+w.h});xs.push(w.x,w.x+w.w);ys.push(w.y,w.y+w.h);}}
  for(const arr of [state.exits,state.safes,state.starts])for(const r of arr){if(ex&&ex.has(r))continue;
    pts.push({x:r.x,y:r.y},{x:r.x+r.w,y:r.y},{x:r.x,y:r.y+r.h},{x:r.x+r.w,y:r.y+r.h});xs.push(r.x,r.x+r.w);ys.push(r.y,r.y+r.h);}
  return{pts,xs,ys,segs};}
function nearestIn(v,list,tol){let b=null,bd=tol;for(const c of list){const d=Math.abs(c-v);if(d<=bd){bd=d;b=c;}}return b;}
// snap one point. lockX/lockY: that coordinate must not change (Shift axis lock)
function snapPoint(p,e,ex,lockX,lockY){
  const out={x:p.x,y:p.y};SNAP.vis={pts:[],vx:[],hy:[]};if(!snapOn(e)&&!gridOn(e))return out;
  const T=snapTargets(ex),tol=SNAP.tol/VIEW.z;
  if(snapOn(e)){
    if(!lockX&&!lockY){let b=null,bd=tol;for(const q of T.pts){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<=bd){bd=d;b=q;}}
      if(b){SNAP.vis.pts.push(b);return{x:b.x,y:b.y};}
      let bs=null,bsd=tol,bq=null;for(const w of T.segs){const q=segClosest(w,p),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bsd){bsd=d;bs=w;bq=q;}}
      if(bq){SNAP.vis.pts.push(bq);return{x:bq.x,y:bq.y};}}
    if(!lockX){const x=nearestIn(p.x,T.xs,tol);if(x!==null){out.x=x;SNAP.vis.vx.push(x);}}
    if(!lockY){const y=nearestIn(p.y,T.ys,tol);if(y!==null){out.y=y;SNAP.vis.hy.push(y);}}}
  if(gridOn(e)){const g=SNAP.grid;if(!lockX&&!SNAP.vis.vx.length)out.x=Math.round(out.x/g)*g;if(!lockY&&!SNAP.vis.hy.length)out.y=Math.round(out.y/g)*g;}
  return out;}
// snap a moved box (its edges) by shifting the move vector
function snapDelta(B,T0,e,ex){
  const T={x:T0.x,y:T0.y};SNAP.vis={pts:[],vx:[],hy:[]};if(!snapOn(e)&&!gridOn(e))return T;
  const S=snapTargets(ex),tol=SNAP.tol/VIEW.z;let gx=true,gy=true;
  if(snapOn(e)){let best=null,bd=tol+1;for(const edge of [B.x,B.x+B.w])for(const c of S.xs){const d=Math.abs(edge+T0.x-c);if(d<bd){bd=d;best=[c,c-edge];}}
    if(best){T.x=best[1];SNAP.vis.vx.push(best[0]);gx=false;}
    best=null;bd=tol+1;for(const edge of [B.y,B.y+B.h])for(const c of S.ys){const d=Math.abs(edge+T0.y-c);if(d<bd){bd=d;best=[c,c-edge];}}
    if(best){T.y=best[1];SNAP.vis.hy.push(best[0]);gy=false;}}
  if(gridOn(e)){const g=SNAP.grid;if(gx)T.x=Math.round((B.x+T0.x)/g)*g-B.x;if(gy)T.y=Math.round((B.y+T0.y)/g)*g-B.y;}
  return T;}
function drawSnapVis(cx){const v=SNAP.vis;if(!v)return;cx.save();cx.strokeStyle='#f97316';cx.lineWidth=1;cx.setLineDash([5,4]);
  for(const x of v.vx){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,CANVAS_H);cx.stroke();}for(const y of v.hy){cx.beginPath();cx.moveTo(0,y);cx.lineTo(CANVAS_W,y);cx.stroke();}
  cx.setLineDash([]);cx.lineWidth=2;for(const q of v.pts){cx.beginPath();cx.arc(q.x,q.y,6,0,Math.PI*2);cx.stroke();}cx.restore();}
function drawSizeLabel(cx,text,x,y){const X=(x-VIEW.x)*VIEW.z,Y=(y-VIEW.y)*VIEW.z;hud(cx,()=>{cx.font='bold 12px sans-serif';const w=cx.measureText(text).width+10;cx.fillStyle='rgba(15,23,42,0.85)';cx.fillRect(X,Y-15,w,19);cx.fillStyle='#fff';cx.textAlign='left';cx.fillText(text,X+5,Y-1);});}
// an exit drawn across a wall line is centred on that wall (doors sit in walls)
function lockExitToWall(r){
  for(const w of state.walls){if(w.x1===undefined)continue;
    if(Math.abs(w.y1-w.y2)<0.5&&w.y1>=r.y-4&&w.y1<=r.y+r.h+4&&Math.max(w.x1,w.x2)>r.x&&Math.min(w.x1,w.x2)<r.x+r.w){const th=Math.min(r.h,20);r.y=w.y1-th/2;r.h=th;if(r.w<=r.h)r.w=r.h+4;return 'h';}
    if(Math.abs(w.x1-w.x2)<0.5&&w.x1>=r.x-4&&w.x1<=r.x+r.w+4&&Math.max(w.y1,w.y2)>r.y&&Math.min(w.y1,w.y2)<r.y+r.h){const th=Math.min(r.w,20);r.x=w.x1-th/2;r.w=th;if(r.h<=r.w)r.h=r.w+4;return 'v';}}
  return null;}

/* ===================== Particle tool: several dots per click ===================== */
function dropOpts(){const n=document.getElementById('dropN'),r=document.getElementById('dropR');return{n:clamp(Math.round(+(n&&n.value)||1),1,500),spread:Math.max(0.2,+(r&&r.value)||2)};}
// place up to n dots around the click, inside the same room (no wall between the click and a dot), not on walls or exits
function dropDots(c,n,spreadPx){
  const placed=[],ok=q=>q.x>=RADIUS&&q.y>=RADIUS&&q.x<=CANVAS_W-RADIUS&&q.y<=CANVAS_H-RADIUS&&!inExitRect(q.x,q.y,RADIUS)&&
    state.walls.every(w=>((w.w&&w.h)?rectDist(w,q):segDistToPoint(w.x1,w.y1,w.x2,w.y2,q.x,q.y))>=RADIUS+2)&&!moveCrossesWall(c,q);
  for(const gap of [RADIUS*1.6,RADIUS*0.9]){let tries=0;
    if(!placed.length&&ok(c)){placed.push({x:c.x,y:c.y});}
    while(placed.length<n&&tries<n*80){tries++;const a=Math.random()*Math.PI*2,rr=spreadPx*Math.sqrt(Math.random()),q={x:c.x+Math.cos(a)*rr,y:c.y+Math.sin(a)*rr};
      if(ok(q)&&placed.every(o=>Math.hypot(o.x-q.x,o.y-q.y)>=gap))placed.push(q);}
    if(placed.length>=n)break;}
  return placed;}

const canvas=document.getElementById('canvas');
function canvasPx(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*CANVAS_W/r.width,y:(e.clientY-r.top)*CANVAS_H/r.height};}
function canvasPt(e){const q=canvasPx(e);return{x:q.x/VIEW.z+VIEW.x,y:q.y/VIEW.z+VIEW.y};}
/* zoom with the wheel (towards the cursor); pan by dragging in Simulate/Study, or Space+drag / middle button in Edit */
const PAN={on:false,space:false};
function canPan(e){return e.button===1||(e.button===0&&(state.mode!=='edit'||PAN.space));}
canvas.addEventListener('wheel',e=>{e.preventDefault();const q=canvasPx(e);zoomAt(q.x,q.y,Math.exp(-e.deltaY*0.0015));},{passive:false});
canvas.addEventListener('mousedown',e=>{if(!canPan(e))return;e.preventDefault();e.stopImmediatePropagation();

window.addEventListener('mouseup',()=>{if(!PAN.on)return;PAN.on=false;setCanvasCursor();});
function setCanvasCursor(){const cursors={select:'default',wall:'crosshair',exit:'crosshair',safe:'crosshair',start:'crosshair',room:'crosshair',particle:'copy'};

window.addEventListener('keydown',e=>{const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||e.ctrlKey||e.metaKey)return;

  if(e.button===2){const o=objectAt(pt.x,pt.y);if(o){histPush();const room=!!o.room;removeObject(o);updateSelectionPanel();document.getElementById('statParticles').textContent=state.particles.length;setStatus(room?'Room deleted.':'Deleted.');redraw();}return;}

  const E=g.exits.length,post=new Float64Array(E),notes=[];
  if(!state.safes.length)return{post,safeField:null,outGrid:null,safeCount:0,destNotes:notes};
  const inside=new Uint8Array(g.N),stack=[];for(const c of startCells)if(!inside[c]){inside[c]=1;stack.push(c);}
  const DR=[-1,1,0,0],DC=[0,0,-1,1];
  while(stack.length){const i=stack.pop(),r=(i/g.W)|0,c=i-r*g.W;for(let k=0;k<4;k++){const nr=r+DR[k],nc=c+DC[k];if(nr<0||nr>=g.H||nc<0||nc>=g.W)continue;const ni=nr*g.W+nc;
    if(inside[ni]||g.wall[ni]||g.exitId[ni]>=0)continue;inside[ni]=1;stack.push(ni);}}
  // "inside" never contains a safe zone: anyone who can reach one without an exit was already counted as outside
  const safeCells=safeCellsIn,wall=new Uint8Array(g.N);for(let i=0;i<g.N;i++)wall[i]=g.wall[i]||inside[i];
  const outGrid={...g,wall},safeField=safeCells.length?stDistField(outGrid,safeCells):new Float64Array(g.N).fill(Infinity);
  for(const ex of g.exits){let m=Infinity;for(const i of ex.cells)if(safeField[i]<m)m=safeField[i];post[ex.k]=m;if(!isFinite(m))notes.push('Exit '+ex.name+' has no outdoor route to a safe zone, so it is not used');}
  return{post,safeField,outGrid,safeCount:state.safes.length,destNotes:notes};}

function stMakeAgents(w,n,seed){
  if(w.fixed)n=w.cells.length;
  const rng=mulberry32(seed*7919+13),E=w.E,nc=w.cells.length,dist=new Float64Array(n*E),speed=new Float64Array(n),delay=new Float64Array(n),cell=new Int32Array(n);
  const out=new Uint8Array(n),direct=new Float64Array(n);
  for(let i=0;i<n;i++){const j=w.fixed?i:Math.floor(rng()*nc);out[i]=w.outdoor?w.outdoor[j]:0;direct[i]=w.direct?w.direct[j]:Infinity;cell[i]=w.cells[j];for(let e=0;e<E;e++)dist[i*E+e]=w.cellDist[j*E+e];}
  for(let i=0;i<n;i++)speed[i]=1.2+0.2*rng();for(let i=0;i<n;i++)delay[i]=10+20*rng();
  return{n,E,dist,speed,delay,cell,seed,post:w.post,out,direct};}

/* ---- event-based engine: FIFO door queues, service time 1/(flow*width) ---- */
function stSimulate(ag,choice,widths,tLimit=STUDY.TLIMIT){
  const n=ag.n,E=widths.length,svc=widths.map(w=>1/(STUDY.FLOW*w)),arrive=new Float64Array(n),start=new Float64Array(n).fill(Infinity);let finish=new Float64Array(n).fill(Infinity);
  const ids=Array.from({length:E},()=>[]);
  for(let i=0;i<n;i++){if(ag.out&&ag.out[i]){arrive[i]=Infinity;continue;}const e=choice[i];arrive[i]=ag.delay[i]+ag.dist[i*ag.E+e]/ag.speed[i];ids[e].push(i);}
  const maxQ=new Array(E).fill(0),order=[];
  for(let e=0;e<E;e++){const a=ids[e];a.sort((p,q)=>(arrive[p]-arrive[q])||(p-q));order.push(a);
    const s=new Float64Array(a.length);let tf=0;
    for(let j=0;j<a.length;j++){const ai=arrive[a[j]];if(!isFinite(ai)){s[j]=Infinity;continue;}tf=ai>tf?ai:tf;s[j]=tf;start[a[j]]=tf;finish[a[j]]=tf+svc[e];tf+=svc[e];}
    let p=0;for(let j=0;j<a.length;j++){const ai=arrive[a[j]];if(!isFinite(ai))break;while(p<a.length&&s[p]<=ai)p++;const q=j+1-Math.min(p,j+1);if(q>maxQ[e])maxQ[e]=q;}}
  // arrival at the safe zone = leaving the door + walking outside to the nearest safe zone (0 if no safe zone is drawn)
  const doorFinish=finish;if(ag.post){const fin=new Float64Array(n);for(let i=0;i<n;i++)fin[i]=ag.out&&ag.out[i]?ag.delay[i]+ag.direct[i]/ag.speed[i]:doorFinish[i]+ag.post[choice[i]]/ag.speed[i];finish=fin;}
  let sum=0,cnt=0,cap=0,mk=0;for(let i=0;i<n;i++){const f=finish[i];cap+=Math.min(f,tLimit);if(f<=tLimit){sum+=f;cnt++;if(f>mk)mk=f;}}
  return{avg:cnt?sum/cnt:tLimit,capped:cap/n,maxQueue:Math.max(...maxQ),nEvac:cnt,makespan:cnt?mk:tLimit,loads:ids.map(a=>a.length),doorMaxQ:maxQ,arrive,start,doorFinish,finish,order,svc};}

function stNearest(ag,open){const ch=new Int32Array(ag.n);for(let i=0;i<ag.n;i++){let b=open[0],bd=Infinity;for(const e of open){const d=ag.dist[i*ag.E+e];if(d<bd){bd=d;b=e;}}ch[i]=b;}return ch;}
function stReroute(ag,open,widths){
  const svc=widths.map(w=>1/(STUDY.FLOW*w)),com=widths.map(()=>[]),ch=new Int32Array(ag.n),ord=Array.from({length:ag.n},(_,i)=>i).sort((a,b)=>(ag.delay[a]-ag.delay[b])||(a-b));
  for(const i of ord){if(ag.out&&ag.out[i]){ch[i]=open[0];continue;}let be=open[0],bf=Infinity,ba=0;
    for(const e of open){const d=ag.dist[i*ag.E+e];if(!isFinite(d))continue;const a=ag.delay[i]+d/ag.speed[i];let tf=0;for(const x of com[e]){if(x>a)break;tf=Math.max(x,tf)+svc[e];}const f=Math.max(a,tf)+svc[e]+(ag.post?ag.post[e]/ag.speed[i]:0);if(f<bf){bf=f;be=e;ba=a;}}
    ch[i]=be;const arr=com[be];let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<=ba)lo=m+1;else hi=m;}arr.splice(lo,0,ba);}
  return ch;}

/* ---- PSO over exit penalties ----
   A particle = one penalty (metres) per open exit. Each person inside picks the open exit with the lowest
   (walk to the exit + walk outside to the nearest safe zone + penalty of that exit). All penalties 0 = shortest route
   to safety. A penalty makes an exit count as farther, so only people for whom it is clearly best still use it.
   Particle 0 starts at all zeros, so on the training crowds PSO can only match or beat the shortest-route rule. */
function stPenChoose(ag,open,pen){const ch=new Int32Array(ag.n);
  for(let i=0;i<ag.n;i++){if(ag.out&&ag.out[i]){ch[i]=open[0];continue;}let b=open[0],bd=Infinity;
    for(const e of open){const d=ag.dist[i*ag.E+e]+(ag.post?ag.post[e]:0)+pen[e];if(d<bd){bd=d;b=e;}}ch[i]=b;}
  return ch;}
async function stPSOPen(fit,open,E,o,onIter){
  const{particles:P=20,iters:T=30,w=0.7,c1=1.5,c2=1.5,seed=0,hi=STUDY.PENMAX}=o,rng=mulberry32(seed+99),vmax=0.2*hi,D=open.length;
  const full=x=>{const pen=new Array(E).fill(0);open.forEach((e,d)=>{pen[e]=x[d];});return pen;};let evals=0;
  const ev=x=>{evals++;return fit(full(x));};
  const x=[],v=[],pb=[],pc=[];
  for(let i=0;i<P;i++){x.push(Array.from({length:D},()=>i===0?0:rng()*hi));v.push(Array.from({length:D},()=>(rng()*2-1)*vmax*0.2));pb.push(x[i].slice());pc.push(ev(x[i]));}
  let g=0;for(let i=1;i<P;i++)if(pc[i]<pc[g])g=i;let gb=pb[g].slice(),gc=pc[g];const hist=[gc];
  for(let t=0;t<T;t++){
    for(let i=0;i<P;i++){for(let d=0;d<D;d++){const r1=rng(),r2=rng();v[i][d]=clamp(w*v[i][d]+c1*r1*(pb[i][d]-x[i][d])+c2*r2*(gb[d]-x[i][d]),-vmax,vmax);x[i][d]=clamp(x[i][d]+v[i][d],0,hi);}
      const c=ev(x[i]);if(c<pc[i]){pc[i]=c;pb[i]=x[i].slice();if(c<gc){gc=c;gb=x[i].slice();}}}
    hist.push(gc);if(onIter)await onIter(t+1,T,gc);}
  return{best:full(gb),cost:gc,hist,evals,zeroCost:pc.length?fit(new Array(E).fill(0)):Infinity};}

/* ---- statistics ---- */
const ST_T95=[12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.160,2.145,2.131,2.120,2.110,2.101,2.093,2.086,2.080,2.074,2.069,2.064,2.060,2.056,2.052,2.048,2.045,2.042];
function stT(df){return df<1?0:df<=30?ST_T95[df-1]:df<=60?2.0:1.96;}
function stSummary(a){const n=a.length,m=a.reduce((p,q)=>p+q,0)/n,sd=n>1?Math.sqrt(a.reduce((p,q)=>p+(q-m)**2,0)/(n-1)):0;return{mean:m,sd,ci:n>1?stT(n-1)*sd/Math.sqrt(n):0,n};}
function stWilcoxon(d){
  const x=d.filter(v=>Math.abs(v)>1e-9),n=x.length;if(!n)return 1;
  const ab=x.map(Math.abs),idx=ab.map((_,i)=>i).sort((a,b)=>ab[a]-ab[b]),rk=new Array(n);let i=0,tie=0,ties=false;
  while(i<n){let j=i;while(j+1<n&&Math.abs(ab[idx[j+1]]-ab[idx[i]])<1e-9)j++;const r=(i+j)/2+1;for(let k=i;k<=j;k++)rk[idx[k]]=r;const t=j-i+1;if(t>1){ties=true;tie+=t**3-t;}i=j+1;}
  let Wp=0;for(let k=0;k<n;k++)if(x[k]>0)Wp+=rk[k];
  if(!ties&&n<=30){const tot=n*(n+1)/2,dp=new Float64Array(tot+1);dp[0]=1;for(let r=1;r<=n;r++)for(let s=tot;s>=r;s--)dp[s]+=dp[s-r];let lo=0,hi=0;for(let s=0;s<=Wp;s++)lo+=dp[s];for(let s=Wp;s<=tot;s++)hi+=dp[s];return Math.min(1,2*Math.min(lo,hi)/Math.pow(2,n));}
  const mu=n*(n+1)/4,sd=Math.sqrt(n*(n+1)*(2*n+1)/24-tie/48);if(sd===0)return 1;const z=(Math.abs(Wp-mu)-0.5)/sd;return Math.min(1,2*(1-stPhi(Math.max(z,0))));}
function stPhi(z){const t=1/(1+0.2316419*Math.abs(z)),p=0.3989423*Math.exp(-z*z/2)*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>=0?1-p:p;}
function stPaired(cond,base,key){const a=cond.rows.pso.map(r=>r[key]),b=cond.rows[base].map(r=>r[key]),d=a.map((v,i)=>v-b[i]),s=stSummary(d),mb=stSummary(b).mean;
  return{meanDiff:s.mean,ci:s.ci,pct:mb?100*s.mean/mb:0,better:d.filter(v=>v<-1e-9).length,n:d.length,p:stWilcoxon(d)};}

/* ---- the study run ---- */
const stTick=()=>new Promise(r=>setTimeout(r,0));
async function stRun(P,onProg){
  const world=stBuildWorld(P.pxPerM);if(world.fixed)P={...P,n:world.cells.length};const widths=world.g.exits.map(e=>e.widthM),names=world.g.exits.map(e=>e.name),E=world.E;
  const userBlocked=world.g.exits.filter(e=>e.blocked||!isFinite(world.post[e.k])).map(e=>e.k);
  const train=STUDY.TRAIN.map(s=>stMakeAgents(world,P.n,s)),seeds=Array.from({length:P.seeds},(_,i)=>STUDY.TEST_BASE+i),test=seeds.map(s=>stMakeAgents(world,P.n,s));
  const scen=[{name:'As drawn',blocked:userBlocked}];
  if(P.alsoBlock){const open=[...Array(E).keys()].filter(e=>!userBlocked.includes(e));if(open.length>1){const use=new Array(E).fill(0);for(const ag of train)for(const e of stNearest(ag,open))use[e]++;let top=open[0];for(const e of open)if(use[e]>use[top])top=e;scen.push({name:'Most-used exit ('+names[top]+') blocked',blocked:[...userBlocked,top]});}}
  const conds=[];
  for(let si=0;si<scen.length;si++){const sc=scen[si],open=[...Array(E).keys()].filter(e=>!sc.blocked.includes(e));if(!open.length)continue;
    const rows={nearest:[],reroute:[],pso:[]};
    const row=(m,ch,comp)=>({avg:m.avg,maxQueue:m.maxQueue,nEvac:m.nEvac,makespan:m.makespan,comp,loads:m.loads.slice()});
    for(let k=0;k<test.length;k++){const ag=test[k];let t=performance.now();const c1=stNearest(ag,open);let c=(performance.now()-t)/1000;rows.nearest.push(row(stSimulate(ag,c1,widths),c1,c));
      t=performance.now();const c2=stReroute(ag,open,widths);c=(performance.now()-t)/1000;rows.reroute.push(row(stSimulate(ag,c2,widths),c2,c));}
    // fitness on the 3 training crowds: capped mean time to safety + queue weight x longest line
    const fit=pen=>{let tot=0;for(const ag of train){const m=stSimulate(ag,stPenChoose(ag,open,pen),widths);tot+=m.capped+P.qw*m.maxQueue;}return tot/train.length;};
    const t0=performance.now();
    const res=await stPSOPen(fit,open,E,{particles:P.particles,iters:P.iters,seed:P.psoSeed||0},async(it,T)=>{if(onProg)onProg(`Scenario ${si+1}/${scen.length} (${sc.name}): PSO iteration ${it}/${T}`,(si+it/T)/scen.length);await stTick();});
    const psoSec=(performance.now()-t0)/1000,pen=res.best;
    for(let k=0;k<test.length;k++){const ag=test[k],ch=stPenChoose(ag,open,pen);rows.pso.push(row(stSimulate(ag,ch,widths),ch,psoSec));}
    conds.push({name:sc.name,blocked:sc.blocked.map(e=>names[e]),open,rows,plan:pen,hist:res.hist,evals:res.evals,zeroCost:res.zeroCost,psoSec,degenerate:open.length===1});}
  if(onProg)onProg('Done.',1);
  return{params:P,world,widths,names,seeds,conds,toSafe:world.safeCount>0,geomKey:geomKey()};}

function stCsv(study){const L=['scenario,blocked,method,seed,avg_time_to_safety_s,max_queue,n_reached_safety,last_arrival_s,comp_time_s,loads'];
  for(const c of study.conds)for(const m of ['nearest','reroute','pso'])c.rows[m].forEach((r,k)=>L.push([JSON.stringify(c.name),c.blocked.join('+')||'none',m,study.seeds[k],r.avg.toFixed(4),r.maxQueue,r.nEvac,r.makespan.toFixed(4),r.comp.toFixed(6),r.loads.map((v,e)=>study.names[e]+':'+v).join('|')].join(',')));
  return L.join('\n');}

/* ---- College preset, from the ground-floor emergency escape plans (north: 25-Classroom Building,
   south: Communication Arts Building). Ground floor only. Scale from one assumption: a classroom is 7 m wide.
   9 px = 1 m. Outer building about 84 m x 63 m. A 3 m corridor runs all around the quadrangle side; rooms are on
   the outer side. North-south length of the west/east sides and the east lobby are estimates (those plans were not available).
   Exits (building doors where lines form):
   Widths are estimates ranked by the group: S = S-court = E (widest) > N-court > NW = NE (a single door).
     NW, NE   north wall at the ends of the west/east corridors ("DN" exits on the plan), single door, 1 m
     S        south lobby main entrance, 4 m
     E        east lobby entrance, 4 m
     N-court  one opening from the north corridor into the quadrangle, 3 m
     S-court  opening from the south corridor / lobby into the quadrangle, 4 m
   Safe zones = assembly points on the plans (outside both north corners, in front of the south lobby, the quadrangle),
   plus open ground on the west and east sides.
   The four corner blocks (stairs, toilets) have a door to the corridor; nobody starts there by default.
   Room doors are drawn 2.2 m wide (the map grid is 1.1 m); room doors have no capacity limit in the model, so this
   only affects the drawing, not the door lines. */
function stCollegeMap(){
  clearMap();
  const W=state.walls,X0=270,X1=1030,Y0=125,Y1=695,      // outer walls
        RX0=370,RX1=930,RY0=225,RY1=595,                    // corridor / room line (rooms are outside it)
        QX0=400,QX1=900,QY0=255,QY1=565;                    // quadrangle wall (corridor is between the two)
  const door=c=>{const a=Math.round((c-15)/10)*10+5;return[a,a+20];};   // 20 px gap starting on a grid-cell centre
  const hw=(y,x0,x1,gaps=[])=>{let t=x0;for(const [a,b] of gaps.slice().sort((p,q)=>p[0]-q[0])){if(a>t)W.push({x1:t,y1:y,x2:a,y2:y});t=Math.max(t,b);}if(x1>t)W.push({x1:t,y1:y,x2:x1,y2:y});};
  const vw=(x,y0,y1,gaps=[])=>{let t=y0;for(const [a,b] of gaps.slice().sort((p,q)=>p[0]-q[0])){if(a>t)W.push({x1:x,y1:t,x2:x,y2:a});t=Math.max(t,b);}if(y1>t)W.push({x1:x,y1:t,x2:x,y2:y1});};
  // outer walls and quadrangle walls (exits are drawn on top of them)
  hw(Y0,X0,X1);hw(Y1,X0,X1);vw(X0,Y0,Y1);vw(X1,Y0,Y1);
  hw(QY0,QX0,QX1);hw(QY1,QX0,QX1);vw(QX0,QY0,QY1);vw(QX1,QY0,QY1);
  const rooms=[];
  // north side: 8 classrooms between the two corridor stubs that lead to NW and NE
  const nN=8,nw=(QX1-QX0)/nN,northDoors=[];
  for(let k=0;k<=nN;k++)vw(QX0+k*nw,Y0,RY0);
  for(let k=0;k<nN;k++){const x=QX0+k*nw;rooms.push({x:x+5,y:Y0+5,w:nw-10,h:RY0-Y0-10});northDoors.push(door(x+nw/2));}
  hw(RY0,QX0,QX1,northDoors);
  vw(RX0,Y0,RY0,[door(175)]);vw(RX1,Y0,RY0,[door(175)]);     // north corner blocks (stairs, toilets) open onto the corridor stubs
  hw(RY0,X0,RX0);hw(RY0,RX1,X1);
  // south side: 3 rooms, the lobby (open to the corridor), 3 rooms
  const LX0=590,LX1=710,sw=(LX0-QX0)/3,southDoors=[];
  for(let k=0;k<=3;k++){vw(QX0+k*sw,RY1,Y1);vw(LX1+k*sw,RY1,Y1);}
  for(let k=0;k<3;k++){for(const x of [QX0+k*sw,LX1+k*sw]){rooms.push({x:x+5,y:RY1+5,w:sw-10,h:Y1-RY1-10});southDoors.push(door(x+sw/2));}}
  hw(RY1,QX0,LX0,southDoors.filter(d=>d[0]<LX0));hw(RY1,LX1,QX1,southDoors.filter(d=>d[0]>LX1));
  hw(RY1,X0,QX0,[door(385)]);hw(RY1,QX1,X1,[door(915)]);     // south corner blocks (stairs, toilets) open onto the corridor ends
  // west side: 6 rooms

  for(let k=0;k<nWr;k++){const y=RY0+k*wh;rooms.push({x:X0+5,y:y+5,w:RX0-X0-10,h:wh-10});westDoors.push(door(y+wh/2));}
  vw(RX0,RY0,RY1,westDoors);
  // east side: 2 rooms, the east lobby (open to the corridor), 2 rooms
  const EY0=380,EY1=440,eh=(EY0-RY0)/2,eastDoors=[];
  for(const y of [RY0+eh,EY0,EY1,EY1+eh])hw(y,RX1,X1);
  for(const y of [RY0,RY0+eh,EY1,EY1+eh]){rooms.push({x:RX1+5,y:y+5,w:X1-RX1-10,h:eh-10});eastDoors.push(door(y+eh/2));}
  vw(RX1,RY0,EY0,eastDoors.filter(d=>d[0]<EY0));vw(RX1,EY1,RY1,eastDoors.filter(d=>d[0]>EY1));
  // exits
  state.exits.push(
    {x:381,y:121,w:9,h:8,label:'NW'},{x:911,y:121,w:9,h:8,label:'NE'},            // single doors, 1 m (width = the longer side, so kept thin)
    {x:632,y:687,w:36,h:16,label:'S'},{x:1022,y:392,w:16,h:36,label:'E'},          // 4 m
    {x:637,y:247,w:27,h:16,label:'N-court'},                                       // 3 m
    {x:632,y:557,w:36,h:16,label:'S-court'});                                      // 4 m
  // assembly points (safe zones)
  state.safes.push({x:440,y:295,w:420,h:230},{x:285,y:20,w:170,h:80},{x:845,y:20,w:170,h:80},{x:550,y:725,w:200,h:85},
    {x:45,y:310,w:200,h:200},{x:1055,y:310,w:200,h:200});   // west and east open ground
  // people start in the classrooms and offices
  state.starts.push(...rooms);
  const sc=document.getElementById('stScale');if(sc)sc.value=9;
  const nEl=document.getElementById('stN');if(nEl)nEl.value=600;
  STUDY.study=null;STUDY.replay=null;stRefreshExits();
  setStatus('College map loaded from the escape plans (ground floor, classroom = 7 m, about 84 m x 63 m): 24 rooms, 6 exits, 6 assembly areas. Evacuees set to 600 (about 25 per room).');redraw();}

/* ---- replay ---- */
function stPath(w,ex,cell){return stPathOn(w.fields[ex],w.fieldGrids?w.fieldGrids[ex]:w.g,cell);}
function stPathOn(f,g,cell){
  const W=g.W,H=g.H,C=STUDY.CELL,S2=Math.SQRT2*g.cellM;let r=(cell/W)|0,c=cell-r*W;
  const pts=[[(c+.5)*C,(r+.5)*C]],cum=[0],DR=[-1,1,0,0,-1,-1,1,1],DC=[0,0,-1,1,-1,1,-1,1];
  for(let guard=0;f[r*W+c]>0&&isFinite(f[r*W+c])&&guard<3000;guard++){let bk=-1,bd=f[r*W+c];
    for(let k=0;k<8;k++){const nr=r+DR[k],nc=c+DC[k];if(nr<0||nr>=H||nc<0||nc>=W)continue;const ni=nr*W+nc;if(g.wall[ni])continue;if(k>=4&&(g.wall[nr*W+c]||g.wall[r*W+nc]))continue;if(f[ni]<bd-1e-9){bd=f[ni];bk=k;}}
    if(bk<0)break;r+=DR[bk];c+=DC[bk];pts.push([(c+.5)*C,(r+.5)*C]);cum.push(cum[cum.length-1]+(bk<4?g.cellM:S2));}
  return{pts,cum};}
function stPosOn(p,s){const cum=p.cum,n=cum.length;if(s<=0||n<2)return p.pts[0];if(s>=cum[n-1])return p.pts[n-1];let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<=s)lo=m;else hi=m;}const f=(s-cum[lo])/(cum[hi]-cum[lo]||1);return[p.pts[lo][0]+(p.pts[hi][0]-p.pts[lo][0])*f,p.pts[lo][1]+(p.pts[hi][1]-p.pts[lo][1])*f];}
function stReplayBuild(study,cond,method,si){
  const w=study.world,widths=study.widths,ag=stMakeAgents(w,study.params.n,study.seeds[si]);
  let ch;if(method==='nearest')ch=stNearest(ag,cond.open);else if(method==='reroute')ch=stReroute(ag,cond.open,widths);else ch=stPenChoose(ag,cond.open,cond.plan);
  const sim=stSimulate(ag,ch,widths),E=widths.length,C=STUDY.CELL,paths=[],pos=new Int32Array(ag.n).fill(-1);
  for(let i=0;i<ag.n;i++)paths.push(ag.out[i]?stPathOn(w.directField,w.directGrid,ag.cell[i]):stPath(w,ch[i],ag.cell[i]));
  sim.order.forEach(a=>a.forEach((id,j)=>{pos[id]=j;}));
  const dir=[];for(let e=0;e<E;e++){const ctr=centerOf(state.exits[e]);let sx=0,sy=0,n=0;for(let i=0;i<ag.n;i++)if(ch[i]===e&&!ag.out[i]){sx+=paths[i].pts[0][0];sy+=paths[i].pts[0][1];n++;}
    let dx=n?sx/n-ctr.x:0,dy=n?sy/n-ctr.y:-1;const L=Math.hypot(dx,dy)||1;dir.push([dx/L,dy/L]);}
  let tEnd=10;for(let i=0;i<ag.n;i++)if(sim.finish[i]<=STUDY.TLIMIT)tEnd=Math.max(tEnd,sim.finish[i]);
  let outPath=null,spot=null;
  if(w.safeField){outPath=[];for(const ex of w.g.exits){let b=-1,bd=Infinity;for(const i of ex.cells)if(w.safeField[i]<bd){bd=w.safeField[i];b=i;}outPath.push(b>=0&&isFinite(bd)?stPathOn(w.safeField,w.outGrid,b):null);}
    // where each person stands once they reach the safe zone (spread inside the zone they arrive at)
    spot=[];for(let i=0;i<ag.n;i++){const op=ag.out[i]?paths[i]:outPath[ch[i]];if(!op){spot.push(null);continue;}const end=op.pts[op.pts.length-1];
      const z=state.safes.find(r=>end[0]>=r.x-1&&end[0]<=r.x+r.w+1&&end[1]>=r.y-1&&end[1]<=r.y+r.h+1)||{x:end[0]-10,y:end[1]-10,w:20,h:20};
      const h1=Math.sin((i+1)*12.9898+ag.seed*78.233)*43758.5453,h2=Math.sin((i+1)*39.3468+ag.seed*11.135)*24634.6345;const u=h1-Math.floor(h1),v=h2-Math.floor(h2),m=Math.min(6,z.w/3,z.h/3);
      spot.push([z.x+m+u*(z.w-2*m),z.y+m+v*(z.h-2*m)]);}}
  return{ag,ch,sim,paths,pos,dir,outPath,spot,tEnd:Math.min(tEnd+2,STUDY.TLIMIT),cond,method,si,t:0,playing:false,speed:5,last:0};}

function stReplayLegendHtml(rp){
  const chip=(c,t,extra='')=>`<span><i style="background:${c};${extra}"></i>${t}</span>`;
  let h='<div style="margin-top:8px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff"><div style="font-size:12px;font-weight:600">Showing: '+STUDY.NAME[rp.method]+' &middot; dot color = exit used</div><div class="chips">';
  for(const e of rp.cond.open)h+=chip(STUDY.EXCOL[e%8],exitName(e));
  if(rp.ag.out.some(v=>v))h+=chip(STUDY.OUTCOL,'started outside');
  h+='</div><div class="chips" style="color:var(--muted)">'+chip('#94a3b8','not moving yet','opacity:.4')+chip('#94a3b8','in line','box-shadow:0 0 0 1.5px #0f172a')+(rp.spot?chip('#94a3b8','arrived (in safe zone)','opacity:.55'):'')+'</div></div>';
  return h;}
function stDrawReplay(cx,rp){
  const t=rp.t,ag=rp.ag,sim=rp.sim,E=sim.order.length,ctrs=state.exits.map(centerOf);
  const started=sim.order.map(a=>{let c=0;for(const id of a){if(sim.start[id]<=t)c++;else break;}return c;});
  const q=new Array(E).fill(0);let out=0;
  for(let i=0;i<ag.n;i++){const e=rp.ch[i],outside=ag.out[i],col=outside?STUDY.OUTCOL:STUDY.EXCOL[e%8],fin=sim.finish[i];
    if(fin<=t&&fin<=STUDY.TLIMIT){out++;if(rp.spot&&rp.spot[i]){cx.globalAlpha=0.55;cx.fillStyle=col;cx.beginPath();cx.arc(rp.spot[i][0],rp.spot[i][1],dotR(3.2),0,Math.PI*2);cx.fill();cx.globalAlpha=1;}continue;}
    let x,y,ring=false,alpha=1;const p=rp.paths[i];
    if(outside){if(t<ag.delay[i]){x=p.pts[0][0];y=p.pts[0][1];alpha=0.4;}else{const L=p.cum[p.cum.length-1],fr=fin>ag.delay[i]?(t-ag.delay[i])/(fin-ag.delay[i]):1;[x,y]=stPosOn(p,Math.min(1,fr)*L);}}
    else if(!isFinite(sim.arrive[i])){x=p.pts[0][0];y=p.pts[0][1];alpha=0.3;}
    else if(t<ag.delay[i]){x=p.pts[0][0];y=p.pts[0][1];alpha=0.4;}
    else if(t<sim.arrive[i]){const s=Math.min((t-ag.delay[i])*ag.speed[i],p.cum[p.cum.length-1]);[x,y]=stPosOn(p,s);}
    else if(t>=sim.start[i]){const op=rp.outPath&&rp.outPath[e],df=sim.doorFinish[i];
      if(op&&t>=df){const L=op.cum[op.cum.length-1],fr=fin>df?(t-df)/(fin-df):1;[x,y]=stPosOn(op,fr*L);}else{x=ctrs[e].x;y=ctrs[e].y;}}
    else{const k=rp.pos[i]-started[e],d=rp.dir[e],col6=k%6,row=Math.floor(k/6);q[e]++;ring=true;
      x=ctrs[e].x+d[0]*(14+row*8)+(-d[1])*(col6-2.5)*8;y=ctrs[e].y+d[1]*(14+row*8)+d[0]*(col6-2.5)*8;}
    cx.globalAlpha=alpha;cx.fillStyle=col;cx.beginPath();cx.arc(x,y,dotR(3.6),0,Math.PI*2);cx.fill();
    if(ring){cx.strokeStyle='#0f172a';cx.lineWidth=1;cx.stroke();}}
  cx.globalAlpha=1;cx.font='bold 12px sans-serif';
  for(let e=0;e<E;e++){if(q[e]>0){const d=rp.dir[e];cx.fillStyle='#0f172a';cx.textAlign='center';cx.fillText('queue '+q[e],ctrs[e].x+d[0]*26,ctrs[e].y+d[1]*26-(d[1]>0?-14:6));}}
  for(let e=0;e<E;e++){if(rp.cond.open.includes(e)){const r=state.exits[e];cx.strokeStyle=STUDY.EXCOL[e%8];cx.lineWidth=3;cx.strokeRect(r.x-3,r.y-3,r.w+6,r.h+6);}}
  hud(cx,()=>{const txt=`t = ${t.toFixed(1)} s    ${rp.spot?'at safe zone':'evacuated'} ${out}/${ag.n}    Method: ${STUDY.NAME[rp.method]}    ${rp.cond.name}`;
    cx.font='bold 14px sans-serif';cx.textAlign='left';cx.fillStyle='rgba(255,255,255,0.85)';cx.fillRect(6,6,cx.measureText(txt).width+12,24);cx.fillStyle='#0f172a';cx.fillText(txt,12,22);});

  rp.out=out;}

function stDrawSafes(cx){for(const z of state.safes){cx.fillStyle='rgba(96,165,250,0.18)';cx.strokeStyle='#1d4ed8';cx.lineWidth=1.5;cx.fillRect(z.x,z.y,z.w,z.h);cx.strokeRect(z.x,z.y,z.w,z.h);cx.fillStyle='#1d4ed8';cx.font='bold 11px sans-serif';cx.textAlign='left';cx.fillText('SAFE ZONE',z.x+6,z.y+14);}}
function stDrawStarts(cx){for(const s of state.starts){cx.fillStyle='rgba(251,146,60,0.18)';cx.strokeStyle='#ea580c';cx.lineWidth=1.5;cx.setLineDash([6,4]);cx.fillRect(s.x,s.y,s.w,s.h);cx.strokeRect(s.x,s.y,s.w,s.h);cx.setLineDash([]);cx.fillStyle='#c2410c';cx.font='11px sans-serif';cx.textAlign='left';cx.fillText('START',s.x+6,s.y+14);}}
function stDrawBlocked(cx){for(const e of state.exits){if(!e.blocked)continue;cx.strokeStyle='#dc2626';cx.lineWidth=3;cx.beginPath();cx.moveTo(e.x-3,e.y-3);cx.lineTo(e.x+e.w+3,e.y+e.h+3);cx.moveTo(e.x+e.w+3,e.y-3);cx.lineTo(e.x-3,e.y+e.h+3);cx.stroke();cx.lineWidth=1.5;}}
function stDrawDecor(cx){stDrawStarts(cx);stDrawBlocked(cx);}

function studyRedraw(){
  const c=document.getElementById('canvas'),cx=c.getContext('2d');beginFrame(cx);
  cx.strokeStyle='#eef2f7';cx.lineWidth=1;cx.beginPath();for(let x=40;x<CANVAS_W;x+=40){cx.moveTo(x,0);cx.lineTo(x,CANVAS_H);}for(let y=40;y<CANVAS_H;y+=40){cx.moveTo(0,y);cx.lineTo(CANVAS_W,y);}cx.stroke();
  stDrawSafes(cx);stDrawStarts(cx);
  cx.fillStyle='#b4bcc5';cx.strokeStyle='#64748b';cx.lineWidth=2.5;
  for(const w of state.walls){if(w.w&&w.h){cx.fillRect(w.x,w.y,w.w,w.h);cx.strokeRect(w.x,w.y,w.w,w.h);}else{cx.beginPath();cx.moveTo(w.x1,w.y1);cx.lineTo(w.x2,w.y2);cx.stroke();}}
  const scale=+(document.getElementById('stScale')||{value:20}).value||20;
  state.exits.forEach((e,k)=>{cx.fillStyle=e.blocked?'#fecaca':'#34d399';cx.strokeStyle=e.blocked?'#dc2626':'#059669';cx.lineWidth=2;cx.fillRect(e.x,e.y,e.w,e.h);cx.strokeRect(e.x,e.y,e.w,e.h);
    cx.fillStyle='#0f172a';cx.font='bold 13px sans-serif';cx.textAlign='left';cx.fillText(exitName(k)+(e.blocked?' (blocked)':''),e.x+e.w+4,e.y+14);cx.font='11px sans-serif';cx.fillText((Math.max(e.w,e.h)/scale).toFixed(1)+' m',e.x+e.w+4,e.y+27);});
  stDrawBlocked(cx);
  if(STUDY.replay)stDrawReplay(cx,STUDY.replay);
  else{for(const p of state.particles){const q=p.home||p.pos;cx.fillStyle='#ea580c';cx.beginPath();cx.arc(q.x,q.y,dotR(4),0,Math.PI*2);cx.fill();}
    hud(cx,()=>{cx.fillStyle='#94a3b8';cx.font='14px sans-serif';cx.textAlign='center';cx.fillText('Study mode: press "Run study", then Replay.',CANVAS_W/2,CANVAS_H-24);cx.textAlign='left';});}}

/* ---- charts ---- */
function stCanvas(id){const c=document.getElementById(id);if(!c)return null;const dpr=window.devicePixelRatio||1,W=400,H=210;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';const cx=c.getContext('2d');cx.scale(dpr,dpr);cx.clearRect(0,0,W,H);return{cx,W,H};}
function stNice(v){const p=Math.pow(10,Math.floor(Math.log10(v||1))),f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p;}
function stBars(id,cond,key,title,dec){
  const o=stCanvas(id);if(!o)return;const{cx,W,H}=o,M=['nearest','reroute','pso'],S=M.map(m=>stSummary(cond.rows[m].map(r=>r[key])));
  const top=stNice(Math.max(...S.map(s=>s.mean+s.ci))*1.1)||1,L=42,R=10,T=26,B=34,pw=W-L-R,ph=H-T-B;
  cx.font='12px sans-serif';cx.fillStyle='#0f172a';cx.textAlign='left';cx.fillText(title,6,15);
  cx.strokeStyle='#e2e8f0';cx.fillStyle='#64748b';cx.font='10px sans-serif';cx.textAlign='right';cx.lineWidth=1;
  for(let i=0;i<=4;i++){const v=top*i/4,y=T+ph-ph*i/4;cx.beginPath();cx.moveTo(L,y);cx.lineTo(W-R,y);cx.stroke();cx.fillText(+v.toFixed(1)+'',L-4,y+3);}
  const bw=pw/3*0.62;M.forEach((m,i)=>{const x=L+pw/3*i+(pw/3-bw)/2,h=ph*S[i].mean/top,y=T+ph-h;cx.fillStyle=STUDY.COL[m];cx.fillRect(x,y,bw,h);
    const ex=x+bw/2,y1=T+ph-ph*(S[i].mean+S[i].ci)/top,y2=T+ph-ph*Math.max(0,S[i].mean-S[i].ci)/top;cx.strokeStyle='#475569';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(ex,y1);cx.lineTo(ex,y2);cx.moveTo(ex-4,y1);cx.lineTo(ex+4,y1);cx.moveTo(ex-4,y2);cx.lineTo(ex+4,y2);cx.stroke();
    cx.fillStyle='#0f172a';cx.textAlign='center';cx.font='10px sans-serif';cx.fillText(S[i].mean.toFixed(dec),ex,y1-4);cx.fillStyle='#475569';cx.fillText(STUDY.NAME[m],x+bw/2,H-14);});}
function stConv(id,study){
  const o=stCanvas(id);if(!o)return;const{cx,W,H}=o,L=42,R=10,T=26,B=30,pw=W-L-R,ph=H-T-B,all=study.conds.flatMap(c=>c.hist),mx=Math.max(...all),mn=Math.min(...all),rng=(mx-mn)||1,lo=mn-rng*0.1,hi=mx+rng*0.1,len=Math.max(...study.conds.map(c=>c.hist.length));
  cx.font='12px sans-serif';cx.fillStyle='#0f172a';cx.textAlign='left';cx.fillText('PSO convergence (best fitness, lower is better)',6,15);
  cx.strokeStyle='#e2e8f0';cx.fillStyle='#64748b';cx.font='10px sans-serif';cx.textAlign='right';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=T+ph-ph*i/4;cx.beginPath();cx.moveTo(L,y);cx.lineTo(W-R,y);cx.stroke();cx.fillText(v.toFixed(1),L-4,y+3);}
  cx.textAlign='center';cx.fillText('iteration',L+pw/2,H-4);
  const SCOL=['#0f172a','#94a3b8'];study.conds.forEach((c,k)=>{cx.strokeStyle=SCOL[k%2];cx.lineWidth=2;cx.beginPath();c.hist.forEach((v,i)=>{const x=L+pw*i/Math.max(1,len-1),y=T+ph-ph*(v-lo)/(hi-lo);i?cx.lineTo(x,y):cx.moveTo(x,y);});cx.stroke();
    cx.fillStyle=SCOL[k%2];cx.fillRect(L+8+k*120,T+4,10,3);cx.fillStyle='#475569';cx.textAlign='left';cx.fillText(c.name.slice(0,18),L+22+k*120,T+9);});}

/* ---- results tables ---- */
function stFmt(s,d){return s.mean.toFixed(d)+' ± '+s.ci.toFixed(d);}
function stRenderResults(study){
  const el=document.getElementById('stResults');let h='';
  for(const c of study.conds){
    h+=`<h4 class="sth">${c.name}${c.blocked.length?' (blocked: '+c.blocked.join(', ')+')':''}</h4>`;
    if(c.degenerate)h+='<div class="hint">Only one exit is open, so every method gives the same plan.</div>';
    h+=`<table class="st"><tr><th>Method</th><th>Avg time (s)</th><th>Max queue</th><th>${study.toSafe?'Reached safe':'Out'}</th><th>${study.toSafe?'Last arrival (s)':'Last exit (s)'}</th><th>Compute (s)</th></tr>`;
    for(const m of ['nearest','reroute','pso']){const R=c.rows[m];h+=`<tr><td><span class="dot" style="background:${STUDY.COL[m]}"></span>${STUDY.NAME[m]}</td><td>${stFmt(stSummary(R.map(r=>r.avg)),2)}</td><td>${stFmt(stSummary(R.map(r=>r.maxQueue)),1)}</td><td>${stSummary(R.map(r=>r.nEvac)).mean.toFixed(0)}</td><td>${stSummary(R.map(r=>r.makespan)).mean.toFixed(1)}</td><td>${stSummary(R.map(r=>r.comp)).mean.toFixed(m==='pso'?2:4)}</td></tr>`;}
    h+='</table><div class="small">Mean ± 95% CI over '+study.seeds.length+' test seeds. '+(study.toSafe?'Times are until each person reaches a safe zone (walk to an exit, wait at the door, walk outside). Last arrival = when the headcount can be completed. ':'Times are until each person passes an exit (no safe zone drawn). ')+'PSO compute time is the one-off optimisation.</div>';
    h+='<table class="st"><tr><th>PSO minus</th><th>Metric</th><th>Mean diff [%]</th><th>Better in</th><th>Wilcoxon p</th></tr>';
    for(const b of ['nearest','reroute'])for(const [k,nm] of [['avg','Avg time'],['maxQueue','Max queue']]){const r=stPaired(c,b,k);h+=`<tr><td>${STUDY.NAME[b]}</td><td>${nm}</td><td>${r.meanDiff.toFixed(2)} ± ${r.ci.toFixed(2)} [${r.pct.toFixed(1)}%]</td><td>${r.better}/${r.n}</td><td>${r.p<0.001?'<0.001':r.p.toFixed(3)}</td></tr>`;}
    h+='</table><div class="small">Negative difference means PSO is lower (better). PSO exit penalties: '+c.open.map(e=>study.names[e]+' '+c.plan[e].toFixed(1)+' m').join(', ')+'. A penalty makes that exit count as farther; 0 = no change. Each person uses the exit with the lowest (walk to exit + walk to safe zone + penalty).</div>';}
  el.innerHTML=h;}
function stRedrawCharts(){const s=STUDY.study;if(!s)return;const ci=+document.getElementById('rpCond').value||0,c=s.conds[ci];if(!c)return;
  stBars('stChartA',c,'avg','Average evacuation time (s)',2);stBars('stChartB',c,'maxQueue','Max queue length (agents)',1);stConv('stChartC',s);}

function stRefreshExits(){const el=document.getElementById('stExitList');if(!el)return;const sc=+(document.getElementById('stScale').value)||20;

function stLoop(ts){const rp=STUDY.replay;if(!rp||!rp.playing||state.mode!=='study')return;if(!rp.last)rp.last=ts;const dt=Math.min((ts-rp.last)/1000,0.1);rp.last=ts;rp.t=Math.min(rp.t+dt*rp.speed,rp.tEnd);
  document.getElementById('rpSlider').value=rp.t;redraw();if(rp.t>=rp.tEnd){rp.playing=false;document.getElementById('rpPlay').textContent='▶ Replay';return;}requestAnimationFrame(stLoop);}

function initStudyUI(){
  const side=document.getElementById('sidePanel');
  document.getElementById('mapSec').insertAdjacentHTML('afterend',`<div class="section" id="studySec" data-show="study"><h3>Study</h3>
  <p class="lead">Compares <b>PSO</b> with <b>nearest exit</b> and <b>dynamic reroute</b> on this map: time for everyone to reach a safe zone, and the longest line at a door.</p>
  <div class="grid2"><label class="field">Evacuees<input type="number" id="stN" value="200" step="10"></label><label class="field">Test runs (seeds)<input type="number" id="stSeeds" value="15" step="1"></label></div>
  <div class="hint" id="stNHint" style="margin-top:4px">Used for Start zones only.</div>
  <div id="stExitList" style="margin-top:8px"></div>
  <button class="primary big" id="stRun" style="margin-top:8px">Run study</button>
  <details><summary>Advanced settings</summary>
  <div class="row"><label>PSO particles</label><input type="number" id="stParticles" value="20" step="1"></div>
  <div class="row"><label>PSO iterations</label><input type="number" id="stIters" value="30" step="1"></div>
  <div class="row"><label>Queue weight</label><input type="number" id="stQw" value="0" step="0.1"></div>
  <div class="checkbox-row"><input type="checkbox" id="stAlso" checked><label>Also test with the busiest exit blocked</label></div>
  <div class="hint">Queue weight 0 = PSO minimises time to safety only. A higher weight trades time for shorter lines.</div></details></div>`);
  document.querySelector('.workspace').insertAdjacentHTML('beforeend',`<div class="studypanel" id="studyPanel">
  <div class="section"><h3>Run</h3><div id="stProg" class="small" style="font-weight:600;color:#334155">Not run yet. Press <b>Run study</b> on the left.</div><progress id="stBar" max="1" value="0" style="width:100%"></progress><details id="stNotesBox" hidden><summary>Run details</summary><div id="stNotes" class="hint" style="margin-top:0"></div></details></div>
  <div class="section"><h3>Replay</h3>
   <div class="grid2"><label class="field">Method<select class="selectbox" id="rpMethod"><option value="pso">PSO</option><option value="nearest">Nearest exit</option><option value="reroute">Dynamic reroute</option></select></label>
   <label class="field">Scenario<select class="selectbox" id="rpCond"></select></label>
   <label class="field">Test run<select class="selectbox" id="rpSeed"></select></label>
   <label class="field">Speed<select class="selectbox" id="rpSpeed"><option value="1">1x</option><option value="2">2x</option><option value="5" selected>5x</option><option value="10">10x</option><option value="20">20x</option></select></label></div>
   <div style="height:8px"></div>
   <div style="display:flex;gap:6px"><button class="primary" id="rpPlay">▶ Replay</button><button id="rpRestart">Restart</button></div>
   <input type="range" id="rpSlider" min="0" max="300" step="0.1" value="0" style="width:100%;margin-top:8px">
   <div id="rpLegend"></div></div>
  <div class="section"><div class="sechead"><h3>Results</h3><button id="stCsvBtn">Export CSV</button></div><div id="stResults" class="small">Run the study to see results.</div>
   <canvas id="stChartA" style="margin-top:8px;cursor:default"></canvas><canvas id="stChartB" style="cursor:default"></canvas><canvas id="stChartC" style="cursor:default"></canvas></div></div>`);
  document.getElementById('stScale').addEventListener('change',()=>{stRefreshExits();redraw();});
  document.getElementById('stDemoBtn').addEventListener('click',stDemoMap);
  document.getElementById('stCollegeBtn').addEventListener('click',stCollegeMap);
  document.getElementById('stCsvBtn').addEventListener('click',()=>{if(!STUDY.study){setStatus('Run the study first.');return;}stDownload('swarmpath_results.csv',stCsv(STUDY.study));});
  ['rpCond','rpMethod','rpSeed'].forEach(id=>document.getElementById(id).addEventListener('change',stSelectReplay));
  document.getElementById('rpSpeed').addEventListener('change',()=>{if(STUDY.replay)STUDY.replay.speed=+document.getElementById('rpSpeed').value;});
  document.getElementById('rpSlider').addEventListener('input',e=>{if(STUDY.replay){STUDY.replay.t=+e.target.value;redraw();}});
  document.getElementById('rpRestart').addEventListener('click',()=>{if(STUDY.replay){STUDY.replay.t=0;STUDY.replay.last=0;redraw();}});
  document.getElementById('rpPlay').addEventListener('click',()=>{const rp=STUDY.replay;if(!rp){setStatus('Run the study first.');return;}if(rp.playing){rp.playing=false;document.getElementById('rpPlay').textContent='▶ Replay';return;}
    if(rp.t>=rp.tEnd)rp.t=0;rp.playing=true;rp.last=0;document.getElementById('rpPlay').textContent='⏸ Pause';requestAnimationFrame(stLoop);});
  let running=false;
  document.getElementById('stRun').addEventListener('click',async()=>{if(running)return;running=true;const btn=document.getElementById('stRun');btn.disabled=true;
    const P={pxPerM:+document.getElementById('stScale').value||20,n:Math.max(2,+document.getElementById('stN').value||200),seeds:Math.max(2,+document.getElementById('stSeeds').value||15),
      particles:Math.max(2,+document.getElementById('stParticles').value||20),iters:Math.max(1,+document.getElementById('stIters').value||30),qw:+document.getElementById('stQw').value,alsoBlock:document.getElementById('stAlso').checked,psoSeed:0};
    if(isNaN(P.qw))P.qw=0;const prog=document.getElementById('stProg'),bar=document.getElementById('stBar');
    try{if(STUDY.replay)STUDY.replay.playing=false;document.getElementById('stNotesBox').hidden=true;const study=await stRun(P,(msg,f)=>{prog.textContent=msg;bar.value=f;});STUDY.study=study;STUDY.stale=false;
      document.getElementById('rpCond').innerHTML=study.conds.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('');
      document.getElementById('rpSeed').innerHTML=study.seeds.map((s,i)=>`<option value="${i}">${i+1} (seed ${s})</option>`).join('');
      const pn=study.params.n,src=study.world.fixed?('your '+pn+' placed particles (same start positions every seed; walking speed and reaction delay change per seed)'+(study.world.skipped?'. '+study.world.skipped+' particle(s) could not reach an exit and were left out. Check that their room has a door and that corridors are at least 1.5 m (30 px) wide':'')):(pn+' evacuees placed randomly in the START zones');
      const dn=study.toSafe?(' Destination: nearest of '+study.world.safeCount+' safe zone(s), reached through an exit.'+(study.world.fixed&&study.world.nOutdoor?' '+study.world.nOutdoor+' particle(s) start outside the building and walk straight to the safe zone.':'')+(study.world.destNotes.length?' Note: '+study.world.destNotes.join('. ')+'.':'')):' No safe zone drawn, so people count as safe once they pass an exit.';
      prog.textContent='Done: '+pn+' evacuees, '+P.seeds+' test runs, '+study.conds.length+' scenario(s).';
      const notes=study.world.g.fallback&&!study.world.fixed?'No START zone drawn, so evacuees start anywhere that reaches an exit (including outside walls). Draw a START zone for realistic runs.':('Evacuees: '+src+'.'+dn);
      document.getElementById('stNotes').textContent=notes;const nb=document.getElementById('stNotesBox');nb.hidden=false;nb.open=/left out|Note:|outside|No START/.test(notes);
      stRenderResults(study);stSelectReplay();setStatus('Study complete. Press Replay to watch a run.');}
    catch(err){prog.textContent='Error: '+err.message;document.getElementById('stNotesBox').hidden=true;setStatus('Study failed: '+err.message);}
    btn.disabled=false;running=false;});}
document.addEventListener('DOMContentLoaded',initStudyUI);
/* ===================== UNDO / REDO for layout editing ===================== */
const HIST={undo:[],redo:[],max:100};
function histSnap(){return JSON.stringify({walls:state.walls,exits:state.exits,safes:state.safes,starts:state.starts,
  particles:state.particles.map(p=>({x:p.pos.x,y:p.pos.y}))});}
function histButtons(){const u=document.getElementById('btnUndo'),r=document.getElementById('btnRedo');if(u)u.disabled=!HIST.undo.length;if(r)r.disabled=!HIST.redo.length;}
function histPush(snap){HIST.undo.push(snap||histSnap());if(HIST.undo.length>HIST.max)HIST.undo.shift();HIST.redo=[];histButtons();stMarkStale();}
function histRestore(str){const d=JSON.parse(str);
  state.walls=d.walls;state.exits=d.exits;state.safes=d.safes;state.starts=d.starts||[];
  state.particles=d.particles.map(q=>new Particle(q.x,q.y));
  state.selected=null;state.drag=null;state.iter=0;
  document.getElementById('statParticles').textContent=state.particles.length;document.getElementById('statIter').textContent='0';document.getElementById('statEvac').textContent='0';
  updateSelectionPanel();stRefreshExits();stMarkStale();}
function histUndo(){if(state.mode!=='edit'){setStatus('Switch to Edit Map mode to undo.');return;}if(!HIST.undo.length){setStatus('Nothing to undo.');return;}
  HIST.redo.push(histSnap());histRestore(HIST.undo.pop());histButtons();setStatus('Undid last change ('+HIST.undo.length+' more can be undone).');redraw();}
function histRedo(){if(state.mode!=='edit'){setStatus('Switch to Edit Map mode to redo.');return;}if(!HIST.redo.length){setStatus('Nothing to redo.');return;}
  HIST.undo.push(histSnap());histRestore(HIST.redo.pop());histButtons();setStatus('Redid change.');redraw();}
function stMarkStale(){if(STUDY.study&&!STUDY.stale){STUDY.stale=true;if(STUDY.replay)STUDY.replay.playing=false;STUDY.replay=null;{const lg=document.getElementById('rpLegend');if(lg)lg.innerHTML='';}const p=document.getElementById('stProg');if(p)p.textContent='The map changed since the last run, so results and replay are out of date. Press Run study again.';}}
document.addEventListener('DOMContentLoaded',histButtons);

window.app={undo:histUndo,redo:histRedo,setMode,setTool,applyPso,applyBoids,toggleRun,stepSim,resetSim,saveMap,loadMap,clearMap,deleteSelected,applySelTransform,applySelSize,redraw};
document.addEventListener('DOMContentLoaded',()=>{app.setMode('edit');app.setTool('select');app.redraw();document.getElementById('status').textContent='Ready: load Demo or College, or draw with the tools in the top bar.';});
</script>
